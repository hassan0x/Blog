---
layout: docs
---
<div class="home-content">
  <div class="home-header">
    <h2 class="home-title">Research Notes</h1>
  </div>
  <ul class="post-list">
    {%- for post in site.posts -%}
    <li class="post-entry">
      <a class="post-link" href="{{ post.url | relative_url }}">
        <span>{{ post.title | escape }}</span>
        <svg class="post-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      {%- if post.summary -%}
        <p class="post-summary">{{ post.summary }}</p>
      {%- endif -%}
      <div class="post-meta">
        <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      </div>
    </li>
    {%- endfor -%}
  </ul>
</div>
