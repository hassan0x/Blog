<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>

    <!-- ── Left Sidebar ──────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="{{ '/' | relative_url }}" class="brand-name">{{ site.title | escape }}</a>
        <span class="brand-tagline">Offensive Security Research</span>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <p class="sidebar-section">Posts</p>
        {%- for post in site.posts -%}
          <a href="{{ post.url | relative_url }}"
             class="sidebar-link{% if page.url == post.url %} active{% endif %}">
            <svg class="sidebar-icon" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 3.5A1.5 1.5 0 013.5 2h9A1.5 1.5 0 0114 3.5v9a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 12.5v-9zM4 5a.5.5 0 000 1h8a.5.5 0 000-1H4zm0 2.5a.5.5 0 000 1h8a.5.5 0 000-1H4zM4 10a.5.5 0 000 1h5a.5.5 0 000-1H4z"/>
            </svg>
            <span>{{ post.title | escape }}</span>
          </a>
        {%- endfor -%}
      </nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ── Main ──────────────────────────────────────────────── -->
    <div class="main-wrap">
      <div class="page-body">

        <div class="content-col">
          {{ content }}
        </div>

        <!-- ── Right TOC ────────────────────────────────────── -->
        <aside class="right-toc" id="right-toc" aria-label="On this page">
          <p class="toc-label">On this page</p>
          <ul class="toc-list" id="toc-list"></ul>
        </aside>

      </div>
    </div>

    <!-- ── Mobile toggle ─────────────────────────────────────── -->
    <button class="sidebar-toggle" aria-label="Toggle navigation" onclick="toggleSidebar()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor">
        <rect y="2"   width="15" height="1.5" rx="0.75"/>
        <rect y="6.75" width="15" height="1.5" rx="0.75"/>
        <rect y="11.5" width="15" height="1.5" rx="0.75"/>
      </svg>
    </button>

    <script>
      /* Sidebar toggle */
      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('visible');
      }
      function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('visible');
      }

      document.addEventListener('DOMContentLoaded', function () {

        /* ── Right TOC ──────────────────────────────────────── */
        var content = document.querySelector('.post-content');
        var tocList = document.getElementById('toc-list');
        var rightToc = document.getElementById('right-toc');

        if (content && tocList) {
          var headings = content.querySelectorAll('h2, h3');
          if (headings.length >= 2) {
            headings.forEach(function (h, i) {
              if (!h.id) h.id = 'h-' + i + '-' + h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
              var li  = document.createElement('li');
              var a   = document.createElement('a');
              a.href  = '#' + h.id;
              a.textContent = h.textContent;
              a.className   = 'toc-link' + (h.tagName === 'H3' ? ' toc-h3' : '');
              li.appendChild(a);
              tocList.appendChild(li);
            });

            /* Scroll spy */
            var links = tocList.querySelectorAll('.toc-link');
            var observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                var link = tocList.querySelector('a[href="#' + entry.target.id + '"]');
                if (link) link.classList.toggle('active', entry.isIntersecting);
              });
            }, { rootMargin: '0px 0px -65% 0px', threshold: 0 });

            headings.forEach(function (h) { observer.observe(h); });
          } else {
            if (rightToc) rightToc.style.display = 'none';
          }
        } else {
          if (rightToc) rightToc.style.display = 'none';
        }

        /* ── Copy buttons ────────────────────────────────────── */
        document.querySelectorAll('pre').forEach(function (pre) {
          /* language label */
          var code = pre.querySelector('code');
          if (code) {
            var m = code.className.match(/language-(\w+)/);
            if (m && m[1] !== 'text' && m[1] !== 'plaintext') {
              var lbl = document.createElement('span');
              lbl.className   = 'code-lang';
              lbl.textContent = m[1];
              pre.appendChild(lbl);
            }
          }
          /* copy button */
          var btn = document.createElement('button');
          btn.textContent = 'Copy';
          btn.className   = 'copy-btn';
          btn.addEventListener('click', function () {
            var text = code ? code.textContent : pre.textContent;
            navigator.clipboard.writeText(text).then(function () {
              btn.textContent = 'Copied!';
              btn.classList.add('copied');
              setTimeout(function () {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
              }, 2000);
            });
          });
          pre.appendChild(btn);
        });

      });
    </script>

  </body>
</html>
