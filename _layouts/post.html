---
layout: docs
---

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="{{ '/' | relative_url }}">Posts</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-cur">{{ page.title | escape }}</span>
</nav>

<time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
  {{ page.date | date: "%b %-d, %Y" }}
</time>

<div class="post-content">
  {{ content }}
</div>

<nav class="post-nav" aria-label="Post navigation">
  {%- if page.previous -%}
  <a class="post-nav-item" href="{{ page.previous.url | relative_url }}">
    <span class="nav-dir">← Previous</span>
    <span class="nav-title">{{ page.previous.title | escape }}</span>
  </a>
  {%- else -%}<span></span>{%- endif -%}

  {%- if page.next -%}
  <a class="post-nav-item nav-right" href="{{ page.next.url | relative_url }}">
    <span class="nav-dir">Next →</span>
    <span class="nav-title">{{ page.next.title | escape }}</span>
  </a>
  {%- else -%}<span></span>{%- endif -%}
</nav>
